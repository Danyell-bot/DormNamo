<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dorm Namo UI Concept</title>
        <style>
            :root {
            --bg-color: #ffffff;
            --grid-line: rgba(92, 142, 222, 0.422);
            --grid-size: 32px;
            }

            * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            }

            body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #0080ff;
            background-color: var(--bg-color);

            background-image:
                linear-gradient(to right, var(--grid-line) 2px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 2px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            }

            .page-wrapper {
            min-height: 100vh;
            padding: 3rem 1.5rem;
            background: radial-gradient(circle at center, transparent 20%, var(--bg-color) 90%);
            }

            .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            }
        </style>
    </head>

    <body>
